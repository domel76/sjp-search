<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">SJP Search</title>
  <desc id="desc">Niebieska ikona wyszukiwarki polskich form słów z literami SJP</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d6efd"/>
      <stop offset="1" stop-color="#6610f2"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#081c4d" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#background)" filter="url(#shadow)"/>
  <circle cx="224" cy="216" r="132" fill="url(#glass)" stroke="#ffffff" stroke-width="22"/>
  <path d="M320 313 L404 397" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round"/>
  <text x="224" y="242" fill="#092f73" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="800" letter-spacing="2" text-anchor="middle">SJP</text>
  <path d="M100 100 Q126 76 160 68" fill="none" stroke="#ffffff" stroke-opacity="0.26" stroke-width="10" stroke-linecap="round"/>
</svg>
