<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SJP Search</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- JSZip do rozpakowywania archiwum -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            min-height: 100vh;
        }
        .mono-font {
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
        .main-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }
        .generated-regex {
            background-color: #212529;
            color: #0d6efd;
            border-radius: 0.5rem;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 8px;
            max-height: 380px;
            overflow-y: auto;
            padding: 8px;
        }
        .word-badge {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 6px 10px;
            text-align: center;
            font-size: 0.95rem;
            transition: all 0.15s ease-in-out;
            cursor: default;
        }
        .word-badge:hover {
            background-color: #e9ecef;
            border-color: #0d6efd;
            color: #0d6efd;
        }
        .form-control:focus, .form-check-input:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
        /* Ukrycie domyślnych strzałek w input number dla czystszego wyglądu */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>

<div class="container py-5" style="max-width: 900px;">
    
    <!-- Nagłówek -->
    <div class="d-flex align-items-center justify-content-between mb-4 pb-2">
        <div class="d-flex align-items-center gap-2">
            <div class="bg-primary text-white rounded-3 p-2 d-flex align-items-center justify-content-center" style="width: 42px; height: 42px;">
                <i class="bi bi-search fs-4"></i>
            </div>
            <div>
                <h1 class="h3 mb-0 fw-bold text-dark">SJP Search</h1>
                <p class="text-muted small mb-0">Wyszukiwarka słów SJP z generatorem Regex</p>
            </div>
        </div>
        <button id="clearBtn" class="btn btn-outline-danger btn-sm rounded-pill px-3" style="display: none;">
            <i class="bi bi-trash me-1"></i>Resetuj słownik
        </button>
    </div>

    <!-- Pasek statusu -->
    <div class="alert alert-primary d-flex align-items-center mb-4 border-0 shadow-sm rounded-3" role="alert">
        <i class="bi bi-info-circle-fill me-2 fs-5"></i>
        <div id="status" class="fw-medium">Inicjalizacja...</div>
    </div>

    <!-- Panel filtrów -->
    <div class="card main-card mb-4">
        <div class="card-body p-4">
            
            <!-- 3 pola w jednym rzędzie -->
            <div class="row g-3 mb-4">
                <div class="col-md-4">
                    <label for="prefixInput" class="form-label fw-semibold text-secondary small text-uppercase">Początek słowa</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-type-first text-muted"></i></span>
                        <input type="text" id="prefixInput" class="form-control mono-font" placeholder="np. kw" maxlength="10">
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="lettersInput" class="form-label fw-semibold text-secondary small text-uppercase">Dostępne litery (max 9)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-fonts text-muted"></i></span>
                        <input type="text" id="lettersInput" class="form-control mono-font" placeholder="np. asirkz" maxlength="9">
                    </div>
                </div>
                <div class="col-md-4">
                    <label for="requiredCharInput" class="form-label fw-semibold text-secondary small text-uppercase">Musi zawierać (1 litera)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-exclamation-circle text-muted"></i></span>
                        <input type="text" id="requiredCharInput" class="form-control mono-font text-center fw-bold text-primary" placeholder="np. z" maxlength="1">
                    </div>
                </div>
            </div>

            <!-- Liczba liter z przyciskami +/- (w jednej linii) -->
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small text-uppercase">Liczba liter od</label>
                    <div class="input-group">
                        <button class="btn btn-outline-secondary" type="button" id="btnLenFromMinus"><i class="bi bi-dash-lg"></i></button>
                        <input type="number" id="lenFrom" class="form-control text-center mono-font fw-bold" value="4" min="1" max="30">
                        <button class="btn btn-outline-secondary" type="button" id="btnLenFromPlus"><i class="bi bi-plus-lg"></i></button>
                    </div>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold text-secondary small text-uppercase">Liczba liter do</label>
                    <div class="input-group">
                        <button class="btn btn-outline-secondary" type="button" id="btnLenToMinus"><i class="bi bi-dash-lg"></i></button>
                        <input type="number" id="lenTo" class="form-control text-center mono-font fw-bold" value="15" min="1" max="30">
                        <button class="btn btn-outline-secondary" type="button" id="btnLenToPlus"><i class="bi bi-plus-lg"></i></button>
                    </div>
                </div>
            </div>

            <!-- Przełącznik zakresu wyszukiwania -->
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small text-uppercase d-block mb-2">Zakres wyszukiwania</label>
                <div class="d-flex gap-3">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="searchScope" id="scopeBase" value="base" checked>
                        <label class="form-check-label fw-medium" for="scopeBase">Tylko formy podstawowe</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="searchScope" id="scopeAll" value="all">
                        <label class="form-check-label fw-medium" for="scopeAll">Wszystkie formy (z odmianami)</label>
                    </div>
                </div>
            </div>

            <!-- Wygenerowany Regex -->
            <div>
                <label class="form-label fw-semibold text-secondary small text-uppercase">Wygenerowane wyrażenie (Regex)</label>
                <div class="generated-regex p-3 d-flex justify-content-between align-items-center mono-font">
                    <span id="generatedRegex" class="text-info text-break me-2">^.*$</span>
                    <button id="copyRegexBtn" class="btn btn-sm btn-outline-light rounded-2" title="Kopiuj do schowka">
                        <i class="bi bi-clipboard"></i>
                    </button>
                </div>
            </div>

        </div>
    </div>

    <!-- Wyniki wyszukiwania -->
    <div class="card main-card" id="resultsCard" style="display: none;">
        <div class="card-header bg-white border-bottom py-3 d-flex justify-content-between align-items-center">
            <h5 class="card-title mb-0 fs-6 fw-bold text-secondary text-uppercase">
                <i class="bi bi-grid-fill text-primary me-2"></i>Wyniki
            </h5>
            <span id="resultsCount" class="badge bg-secondary rounded-pill">0</span>
        </div>
        <div class="card-body p-3">
            <div id="results" class="results-grid mono-font"></div>
        </div>
    </div>

</div>

<script>
    const PROXY_WORKER_URL = 'https://sjp-search-proxy.domel76.workers.dev/';

    const DB_NAME = 'SjpSearchDB';
    const STORE_NAME = 'wordsStore';

    let baseWordsList = [];
    let allWordsList = [];

    // Elementy DOM
    const status = document.getElementById('status');
    const clearBtn = document.getElementById('clearBtn');
    const resultsDiv = document.getElementById('results');
    const resultsCard = document.getElementById('resultsCard');
    const resultsCount = document.getElementById('resultsCount');
    const scopeRadios = document.querySelectorAll('input[name="searchScope"]');

    const prefixInput = document.getElementById('prefixInput');
    const lettersInput = document.getElementById('lettersInput');
    const requiredCharInput = document.getElementById('requiredCharInput');
    
    const lenFromInput = document.getElementById('lenFrom');
    const lenToInput = document.getElementById('lenTo');
    const btnLenFromMinus = document.getElementById('btnLenFromMinus');
    const btnLenFromPlus = document.getElementById('btnLenFromPlus');
    const btnLenToMinus = document.getElementById('btnLenToMinus');
    const btnLenToPlus = document.getElementById('btnLenToPlus');

    const generatedRegexDiv = document.getElementById('generatedRegex');
    const copyRegexBtn = document.getElementById('copyRegexBtn');

    let currentRegexPattern = '^.*$';

    // Obsługa przycisków +/-
    function adjustValue(input, delta) {
        let val = parseInt(input.value, 10) || 1;
        const min = parseInt(input.min, 10) || 1;
        const max = parseInt(input.max, 10) || 30;

        val += delta;
        if (val < min) val = min;
        if (val > max) val = max;

        input.value = val;
        updateRegex();
    }

    btnLenFromMinus.addEventListener('click', () => adjustValue(lenFromInput, -1));
    btnLenFromPlus.addEventListener('click', () => adjustValue(lenFromInput, 1));
    btnLenToMinus.addEventListener('click', () => adjustValue(lenToInput, -1));
    btnLenToPlus.addEventListener('click', () => adjustValue(lenToInput, 1));

    // Aktualizacja i generowanie REGEXP
    function updateRegex() {
        const prefix = prefixInput.value.trim().toLowerCase();
        const letters = lettersInput.value.trim().toLowerCase();
        const requiredChar = requiredCharInput.value.trim().toLowerCase();
        
        let minTotal = parseInt(lenFromInput.value, 10) || 1;
        let maxTotal = parseInt(lenToInput.value, 10) || 1;

        if (minTotal > maxTotal) {
            maxTotal = minTotal;
            lenToInput.value = maxTotal;
        }

        const prefixLen = prefix.length;
        const remMin = Math.max(0, minTotal - prefixLen);
        const remMax = Math.max(0, maxTotal - prefixLen);

        let pattern = '^';

        // Jeżeli podano wymaganą literę, stosujemy lookahead (?=.*L)
        if (requiredChar.length > 0) {
            const escapedChar = requiredChar.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            pattern += `(?=.*${escapedChar})`;
        }

        if (prefixLen > 0) {
            pattern += prefix;
        }

        if (letters.length > 0) {
            const uniqueLetters = Array.from(new Set(letters.split(''))).join('');
            pattern += `[${uniqueLetters}]`;
        } else {
            pattern += '[a-ząćęłńóśźż]';
        }

        if (remMin === remMax) {
            pattern += `{${remMin}}`;
        } else {
            pattern += `{${remMin},${remMax}}`;
        }

        pattern += '$';

        currentRegexPattern = pattern;
        generatedRegexDiv.textContent = pattern;

        performSearch();
    }

    prefixInput.addEventListener('input', updateRegex);
    lettersInput.addEventListener('input', updateRegex);
    requiredCharInput.addEventListener('input', updateRegex);
    lenFromInput.addEventListener('input', updateRegex);
    lenToInput.addEventListener('input', updateRegex);
    scopeRadios.forEach(radio => radio.addEventListener('change', performSearch));

    // Kopiowanie Regexu do schowka
    copyRegexBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(currentRegexPattern).then(() => {
            const icon = copyRegexBtn.querySelector('i');
            icon.className = 'bi bi-check-lg text-success';
            setTimeout(() => {
                icon.className = 'bi bi-clipboard';
            }, 1500);
        });
    });

    // IndexedDB & Pobieranie SJP
    function openDB() {
        return new Promise((resolve, reject) => {
            const req = indexedDB.open(DB_NAME, 1);
            req.onupgradeneeded = (e) => e.target.result.createObjectStore(STORE_NAME);
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => reject(req.error);
        });
    }

    async function saveToDB(data) {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(data, 'dictionary');
        return tx.complete;
    }

    async function loadFromDB() {
        const db = await openDB();
        return new Promise((resolve) => {
            const tx = db.transaction(STORE_NAME, 'readonly');
            const req = tx.objectStore(STORE_NAME).get('dictionary');
            req.onsuccess = () => resolve(req.result);
            req.onerror = () => resolve(null);
        });
    }

    async function clearDB() {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete('dictionary');
        location.reload();
    }

    function setReady(baseCount, allCount) {
        status.textContent = `Słownik gotowy! Formy podstawowe: ${baseCount.toLocaleString()}, Wszystkie: ${allCount.toLocaleString()}`;
        clearBtn.style.display = 'inline-block';
        updateRegex();
    }

    async function fetchAndProcessRemote() {
        try {
            status.textContent = '1/3 Pobieranie słownika ze strony SJP...';
            const res = await fetch(PROXY_WORKER_URL);
            if (!res.ok) throw new Error('Nie udało się pobrać pliku z proxy.');

            const blob = await res.blob();

            status.textContent = '2/3 Rozpakowywanie archiwum ZIP w pamięci...';
            const zip = await JSZip.loadAsync(blob);
            const odmFile = zip.file("odm.txt") || Object.values(zip.files).find(f => f.name.endsWith('.txt'));

            if (!odmFile) throw new Error('Brak pliku .txt w archiwum.');

            const text = await odmFile.async("string");

            status.textContent = '3/3 Indeksowanie bazy słów...';
            setTimeout(async () => {
                const lines = text.split(/\r?\n/);
                const baseSet = new Set();
                const allSet = new Set();

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i].trim();
                    if (!line) continue;

                    const wordsInLine = line.split(/,\s*/);
                    if (wordsInLine.length > 0) {
                        const baseWord = wordsInLine[0].trim();
                        if (baseWord) {
                            baseSet.add(baseWord);
                            allSet.add(baseWord);
                        }
                        for (let j = 1; j < wordsInLine.length; j++) {
                            const form = wordsInLine[j].trim();
                            if (form) allSet.add(form);
                        }
                    }
                }

                baseWordsList = Array.from(baseSet);
                allWordsList = Array.from(allSet);

                await saveToDB({ base: baseWordsList, all: allWordsList });
                setReady(baseWordsList.length, allWordsList.length);
            }, 50);

        } catch (err) {
            status.textContent = 'Błąd: ' + err.message;
        }
    }

    function performSearch() {
        if (baseWordsList.length === 0) return;

        resultsDiv.innerHTML = '';
        const selectedScope = document.querySelector('input[name="searchScope"]:checked').value;
        const targetList = (selectedScope === 'base') ? baseWordsList : allWordsList;

        try {
            const regex = new RegExp(currentRegexPattern, 'i');
            const matches = [];

            for (let i = 0; i < targetList.length; i++) {
                if (regex.test(targetList[i])) {
                    matches.push(targetList[i]);
                    if (matches.length >= 1000) break;
                }
            }

            if (matches.length === 0) {
                resultsCard.style.display = 'none';
                status.textContent = 'Brak wyników spełniających kryteria.';
            } else {
                resultsCard.style.display = 'block';
                status.textContent = `Znaleziono: ${matches.length}${matches.length === 1000 ? ' (pokazano pierwsze 1000)' : ''}`;
                resultsCount.textContent = matches.length;

                const fragment = document.createDocumentFragment();
                matches.forEach(word => {
                    const badge = document.createElement('div');
                    badge.className = 'word-badge';
                    badge.textContent = word;
                    fragment.appendChild(badge);
                });
                resultsDiv.appendChild(fragment);
            }
        } catch (err) {
            status.textContent = 'Błąd w składni wyrażenia Regex.';
        }
    }

    clearBtn.addEventListener('click', clearDB);

    async function init() {
        const cached = await loadFromDB();
        if (cached && cached.base && cached.all) {
            baseWordsList = cached.base;
            allWordsList = cached.all;
            setReady(baseWordsList.length, allWordsList.length);
        } else {
            fetchAndProcessRemote();
        }
    }

    init();
</script>
</body>
</html>
